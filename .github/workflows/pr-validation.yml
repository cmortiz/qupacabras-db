# Advisory pull-request check on benchmark submissions.
#
# Advisory, not a gate: a pull request opened with the default GITHUB_TOKEN raises no
# `pull_request` event, so this workflow does not run at all on bot-opened pull requests, and
# `main` has no branch protection, so a red check here does not block a merge. The gate is the
# build step in deploy.yml. See docs/verification.md.
#
# Two rules hold everywhere in this file:
#
#   1. No `${{ ... }}` appears inside a `run:` or `script:` body. Workflow expressions are pasted
#      into the body as text before the shell or the script engine sees it, so a submitter who
#      names a file `$(...)` or `'; ...` gets that text executed. Values reach a body only through
#      the step's `env:` block, and are read as `"$NAME"` with quotes.
#   2. Anything derived from a submitter, above all a changed-file path, is filtered by
#      scripts/ci/changed-submissions.js before it is used as a name, never by inline shell.
#
# Logic lives in scripts/ci/*.js rather than in run: blocks. Those files are covered by eslint and
# are runnable on their own, and this repository has broken this file's YAML three times inlining
# scripts here (commits ae940e0, 3cca84a, 9ad6d26).

name: PR Validation

on:
  pull_request:
    # `ready_for_review` matters: a draft pull request created by automation and then marked ready
    # by a human re-arms this suite without anyone needing a personal access token.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - 'submissions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-submissions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      # TODO(maintainer): pin this to a commit SHA rather than a mutable tag. A tag can be moved to
      # point at different code without the reference here changing.
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: submissions/**

      # Injection point, closed. `all_changed_files` is submitter-controlled text. It is handed to
      # a script through env, never interpolated into the body, and the script keeps only names
      # that match a conservative pattern and resolve to a directory that exists.
      - name: Resolve changed submission folders
        id: changed-submissions
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: node scripts/ci/changed-submissions.js

      # Runs first, and writes verification-report.md whatever the outcome, so the comment step
      # below always has a body to post. QDB_FOLDERS is set by the step above through $GITHUB_ENV.
      - name: Recompute submitted results
        if: steps.changed-submissions.outputs.count != '0'
        run: node scripts/ci/verification-report.js

      # Scoped to the folders this pull request changed, and no others. `npm run validate` walks
      # the whole corpus and exits nonzero if any folder is invalid; under the `report` policy a
      # submission that fails to reproduce its own claim can sit on `main`, and a whole-corpus
      # check would then turn every later contributor's pull request red for someone else's data.
      # Whole-corpus validation belongs to the deploy build, which owns the published site.
      # Duplicate detection inside the script below stays corpus-wide, since a submission can only
      # be judged a duplicate against the rest, but anything it finds elsewhere in the corpus is a
      # warning rather than this pull request's failure. QDB_FOLDERS is set by the resolve step
      # above through $GITHUB_ENV.
      - name: Validate the changed submissions against the schema
        if: steps.changed-submissions.outputs.count != '0'
        run: node scripts/ci/validate-changed.js

      - name: Regenerate the benchmark index
        run: node scripts/ci/check-index.js

      # `body-path` in spirit: the body is read from a file, so no report text is ever interpolated
      # into a script. The condition covers a fork, whose GITHUB_TOKEN is read-only and cannot
      # comment; the check status still reports there.
      - name: Comment on the pull request
        if: >-
          always() &&
          steps.changed-submissions.outputs.count != '0' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file verification-report.md
