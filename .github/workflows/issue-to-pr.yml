# Turn a submission issue into a draft pull request.
#
# Everything in the issue body was typed by whoever opened the issue, and this job holds
# `contents: write` and `pull-requests: write`. Three rules hold that boundary, and they are the
# same three that hold in pr-validation.yml:
#
#   1. No `${{ ... }}` appears inside a `run:` body. A workflow expression is pasted into the body
#      as text before the shell sees it, so a contributor who types `$(...)` or `'; ...` into a form
#      field gets that text executed. Values reach a body only through the step's `env:` block and
#      are read as `"$NAME"`, quoted. Expressions in `if:`, `with:` and `env:` are evaluated rather
#      than pasted and are fine.
#   2. Parsing lives in scripts/ci/issue-submission.js, not in a `script:` block here. That file is
#      covered by eslint, runs on its own, and cannot break this file's YAML. This repository has
#      broken workflow YAML three times inlining scripts into it (ae940e0, 3cca84a, 9ad6d26).
#   3. Nothing reaches `submissions/` until the real schema and the real verifier have both accepted
#      it. A submission whose counts do not reproduce its win rate is reported back on the issue
#      rather than turned into a pull request that is certain to fail the deploy gate.
#
# The pull request is opened as a draft, deliberately. A pull request created with the default
# GITHUB_TOKEN raises no `pull_request` event, so pr-validation.yml and test.yml stay dark on it.
# `draft: always-true` means a human has to click "Ready for review", and that click fires the
# `ready_for_review` trigger pr-validation.yml listens for, re-arming the whole suite without anyone
# needing a personal access token. `always-true` rather than `true` so a pull request updated by a
# later edit of the issue goes back to draft and has to be re-armed again.

name: Convert Issue to Submission PR

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  create-submission-pr:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'submission')
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # The parser validates against the committed schema with ajv and recomputes the win rate with
      # the verification core, so the dependencies have to be present before it runs.
      - name: Install dependencies
        run: npm install

      # Injection point, closed. The issue body is submitter-controlled text and is handed to the
      # parser through env, never interpolated into this body. The parser writes
      # issue-submission-report.md whatever the outcome, so both comment steps below always have a
      # body to post, and it exits nonzero when it refused to write a submission folder.
      - name: Build the submission from the issue
        id: submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/ci/issue-submission.js

      # Reported rather than opened: a pull request that cannot pass the gate helps nobody, and the
      # contributor can fix it by editing the issue, which re-runs this workflow.
      - name: Report the rejection on the issue
        if: failure() && steps.submission.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file issue-submission-report.md

      # TODO(maintainer): pin this to a commit SHA rather than a mutable tag. A tag can be moved to
      # point at different code without the reference here changing.
      #
      # `add-paths` keeps the commit to the submission folder. Without it, `npm install` touching
      # package-lock.json and the report file written above would both be swept into the branch.
      - name: Open the draft pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat: benchmark submission from issue #${{ github.event.issue.number }}"
          title: "feat: ${{ steps.submission.outputs.algorithm_name }} (issue #${{ github.event.issue.number }})"
          body: |
            Automated submission built from issue #${{ github.event.issue.number }}.

            Contributor: @${{ github.event.issue.user.login }}
            Folder: `submissions/${{ steps.submission.outputs.dir_name }}/`
            Ships counts: `${{ steps.submission.outputs.has_counts }}`

            This pull request is a **draft** on purpose. It was opened with the default workflow
            token, which raises no `pull_request` event, so the validation suite has not run on it.
            Clicking "Ready for review" fires `ready_for_review` and starts the full suite.

            Closes #${{ github.event.issue.number }}
          branch: "submission/issue-${{ github.event.issue.number }}"
          delete-branch: true
          base: main
          draft: always-true
          add-paths: submissions

      # Silent when the run changed nothing, which is the common case for an issue edited for
      # reasons that do not touch the submission.
      - name: Point the contributor at the pull request
        if: steps.pull-request.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          printf '\nDraft pull request: %s\n\n%s\n' "$PR_URL" \
            'It is a draft until a maintainer clicks "Ready for review", which starts the validation suite.' \
            >> issue-submission-report.md
          gh issue comment "$ISSUE_NUMBER" --body-file issue-submission-report.md
