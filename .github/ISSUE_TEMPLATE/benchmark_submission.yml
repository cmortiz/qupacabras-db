name: 📊 Benchmark Submission
description: Submit a new quantum benchmark result to the database
title: "[Submission]: <Algorithm Name> on <Device>"
labels: ["submission", "automated-pr"]
body:
  - type: markdown
    attributes:
      value: |
        # Benchmark Submission
        
        Thank you for contributing to Qupacabras-DB! 
        
        **How this works:**
        1. Fill out this form
        2. Click "Submit New Issue"
        3. A bot will automatically create a Pull Request for you! 🤖
        
  - type: input
    id: algorithm_name
    attributes:
      label: Algorithm Name
      description: Name of the quantum algorithm (e.g., Grover's Search, QFT, VQE)
      placeholder: Grover's Algorithm
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Quantum Device
      description: Name of the device or simulator used
      placeholder: IBM Sherbrooke
    validations:
      required: true

  - type: dropdown
    id: metric_name
    attributes:
      label: Metric Name
      description: The primary performance metric measured
      options:
        - Fidelity
        - Success Probability
        - Win Rate
        - Approximation Ratio
        - Custom
    validations:
      required: true

  - type: input
    id: metric_value
    attributes:
      label: Metric Value
      description: The numerical result (usually 0.0 to 1.0)
      placeholder: "0.95"
    validations:
      required: true

  - type: input
    id: primary_metric_definition
    attributes:
      label: Primary Metric Definition
      description: Briefly define how the primary metric is computed for this problem instance.
      placeholder: Fraction of winning outputs over total shots
    validations:
      required: false

  - type: input
    id: uncertainty
    attributes:
      label: Uncertainty (Optional)
      description: The margin of error or standard deviation (e.g., 0.02).
      placeholder: "0.02"
    validations:
      required: false

  - type: input
    id: uncertainty_definition
    attributes:
      label: Uncertainty Definition (Optional)
      description: How was this uncertainty calculated? (e.g., Standard Deviation, SEM, 95% CI)
      placeholder: "Standard Error of the Mean"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief description of what was benchmarked and how
      placeholder: Implemented Grover's search for 3 qubits searching for state |101>...
    validations:
      required: false

  - type: input
    id: paper_url
    attributes:
      label: Paper/Preprint URL
      description: Link to the publication or preprint (arXiv, etc.)
      placeholder: https://arxiv.org/abs/2301.xxxxx
    validations:
      required: false

  - type: input
    id: qubit_range_min
    attributes:
      label: Qubit Range (Min)
      description: Minimum number of qubits used across experiments in this submission
      placeholder: "2"
    validations:
      required: false

  - type: input
    id: qubit_range_max
    attributes:
      label: Qubit Range (Max)
      description: Maximum number of qubits used across experiments in this submission
      placeholder: "8"
    validations:
      required: false

  - type: input
    id: shots
    attributes:
      label: Shots
      description: Number of measurement shots/repetitions
      placeholder: "1024"
    validations:
      required: false

  - type: input
    id: one_qubit_fidelity
    attributes:
      label: 1-Qubit Gate Fidelity
      description: Average fidelity of single-qubit gates (e.g., 0.999)
      placeholder: "0.999"
    validations:
      required: false

  - type: input
    id: two_qubit_fidelity
    attributes:
      label: 2-Qubit Gate Fidelity
      description: Average fidelity of two-qubit gates (e.g., 0.99)
      placeholder: "0.99"
    validations:
      required: false

  - type: input
    id: qubit_fidelity
    attributes:
      label: Qubit Fidelity
      description: Representative qubit fidelity for the run.
      placeholder: "0.99"
    validations:
      required: false

  - type: input
    id: readout_fidelity
    attributes:
      label: Readout Fidelity
      description: Representative readout fidelity for the run.
      placeholder: "0.97"
    validations:
      required: false

  - type: textarea
    id: fidelity_measurement_method
    attributes:
      label: Fidelity Measurement Method
      description: Describe how the gate fidelities were measured (e.g., Randomized Benchmarking, GST)
      placeholder: "Standard Randomized Benchmarking with Clifford group..."
    validations:
      required: false

  - type: textarea
    id: qasm_content
    attributes:
      label: QASM Circuit (Optional)
      description: Paste your OpenQASM 2.0/3.0 code here
      render: qasm
    validations:
      required: false

  - type: input
    id: team
    attributes:
      label: Team / Authors
      description: Comma-separated list of contributors or paper authors
      placeholder: "Alice Smith, Bob Jones, Charlie Brown"
    validations:
      required: false

  - type: input
    id: depth_range_min
    attributes:
      label: Circuit Depth Range (Min)
      description: Minimum circuit depth across experiments in this submission
      placeholder: "10"
    validations:
      required: false

  - type: input
    id: depth_range_max
    attributes:
      label: Circuit Depth Range (Max)
      description: Maximum circuit depth across experiments in this submission
      placeholder: "50"
    validations:
      required: false

  - type: input
    id: gate_count
    attributes:
      label: Total Gate Count
      description: Total number of quantum gates
      placeholder: "150"
    validations:
      required: false

  - type: input
    id: lambda1
    attributes:
      label: λ₁ (Normalized Laplacian)
      description: Largest eigenvalue of the normalized Laplacian of the problem or circuit graph
      placeholder: "1.732"
    validations:
      required: false

  - type: dropdown
    id: lambda1_source
    attributes:
      label: λ₁ Source
      description: How was λ₁ derived?
      options:
        - explicit (from problem graph)
        - qasm (from circuit connectivity)
    validations:
      required: false

  - type: input
    id: qubit_time_volume
    attributes:
      label: Qubit Time Volume (Raw)
      description: Raw qubit-time volume in qubit·microseconds (qubits × circuit duration)
      placeholder: "24.5"
    validations:
      required: false

  - type: input
    id: qubit_time_volume_normalized
    attributes:
      label: Qubit Time Volume (Normalized /T2)
      description: Qubit time volume divided by T2 coherence time (dimensionless)
      placeholder: "0.306"
    validations:
      required: false

  - type: input
    id: circuit_duration
    attributes:
      label: Circuit Duration in microseconds
      description: Hardware circuit execution duration in microseconds. Report a representative value such as the median over qubits used.
      placeholder: "12.5"
    validations:
      required: false

  - type: input
    id: t1
    attributes:
      label: T1 in microseconds
      description: Representative T1 coherence time in microseconds, such as the median across qubits used.
      placeholder: "120"
    validations:
      required: false

  - type: input
    id: t2
    attributes:
      label: T2 in microseconds
      description: Representative T2 coherence time in microseconds, such as the median across qubits used.
      placeholder: "80"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any additional context, methodology details, or observations
      placeholder: "Used error mitigation strategy X..."
    validations:
      required: false
